<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Money Management System</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>
    
    <header>
        <h1>Money Management System</h1>
    </header>
    
    <div class="page_layout">
    <nav class="navigation">
        <a href="#">Dashboard</a>
        <a href="#">Transactions</a>
        <a href="#">Budget</a>
    </nav>

    <main class="main_content">
        <h2>Dashboard</h2>
        <p>Welcome to your Money Management System.</p>

        <section class="dashboard_cards">

            <div class="card">
                <h3>Current Balance</h3>
                <p>Rs. 14,570.00</p>
            </div>

            <div class="card">
                <h3>Total Income</h3>
                <p>Rs. 15,000.00</p>
            </div>

            <div class="card">
                <h3>Total Expense</h3>
                <p>Rs. 430.00</p>
            </div>

            <div class="card">
                <h3>Remaining Budget</h3>
                <p>Rs. 14,570.00</p>
            </div>

        </section>

        <section class="transaction_forms">

            <div class="form_container">
                <form>
                    <h3>Add Income</h3>

                    <label for="income_amount">Amount</label>
                    <input type="number" id="income_amount">

                    <label for="income_source">Source</label>
                    <input type="text" id="income_source">

                    <label for="income_date">Date</label>
                    <input type="date" id="income_date">

                    <button type="submit">Add Income</button>
                </form>
            </div>

            <div class="form_container">

                <form>
                    <h3>Add Expense</h3>

                    <label for="expense_amount">Amount</label>
                    <input type="number" id="expense_amount">

                    <label for="expense_category">Category</label>
                    <input type="text" id="expense_category">

                    <label for="expense_description">Description</label>
                    <input type="text" id="expense_description">

                    <label for="expense_date">Date</label>
                    <input type="date" id="expense_date">

                    <button type="submit">Add Expense</button>
                </form>
            </div>
        </section>

    </main>
    </div>

</body>
</html>
